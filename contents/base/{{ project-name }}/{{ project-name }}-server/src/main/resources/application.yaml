spring:
  application:
    name: {{ project-name }}

server:
  port: ${SERVER_PORT:{{ service_port }}}

management:
  server:
    port: ${MANAGEMENT_PORT:{{ management_port }}}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /
      path-mapping:
        health: health
        prometheus: metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: {{ project-name }}
  tracing:
    # Tracing/OTLP export is disabled by default so the service starts without an
    # external collector. The platform enables it at deploy time by setting
    # management.tracing.enabled=true and OTEL_EXPORTER_OTLP_ENDPOINT (a full URL).
    enabled: false
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
{% if has_s3 or has_azure_blob %}
storage:
{% if has_s3 %}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    bucket: ${S3_BUCKET:{{ project-name }}}
    prefix: ${S3_PREFIX:}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
{% endif %}
{% if has_azure_blob %}
  azure:
    endpoint: ${AZURE_ENDPOINT:http://localhost:10000/devstoreaccount1}
    container: ${AZURE_CONTAINER:{{ project-name }}}
    account-name: ${AZURE_ACCOUNT_NAME:devstoreaccount1}
    account-key: ${AZURE_ACCOUNT_KEY:Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KkZB2M0XK3Xg==}
{% endif %}
{% endif %}
