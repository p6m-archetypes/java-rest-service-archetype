# Prova acceptance tests: `prova` from the repo root runs the whole suite.
#
# jobs = 1: the suite renders the archetype several times and boots real services against database
# containers; serial execution keeps those heavy units from contending for CPU, memory, and Docker.
[run]
proofs = ["tests"]
jobs = 1

# CI runs the same suite; docker is the only capability a runner needs (S8b).
[profiles.ci]
jobs = 1
format = "json"

# Database containers come from prova's external plugin system (the built-in `db` module is not part
# of the released prova binary). Pinned to the released v1 tags.
[plugins]
postgres = "prova-rs/prova-postgres@v1"
mysql    = "prova-rs/prova-mysql@v1"
# The org standards suite (path-local while it incubates in this workspace — pin its git tag once
# published).
p6m      = "p6m-archetypes/prova-p6m-standards@v1"
