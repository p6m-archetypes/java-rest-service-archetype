# Prova acceptance tests: `prova` from the repo root runs the whole suite.
#
# jobs = 1: the suite renders the archetype many times, and archetect's renderer is not safe to run
# concurrently (it stages fetched components through a shared cache). Serial execution also keeps the
# heavy build/boot units from contending for CPU, memory, and Docker at once.
[run]
paths = ["tests"]
jobs = 1

# CI runs the same suite; capability gating (docker/mvn/java) handles what a runner lacks.
[profiles.ci]
paths = ["tests"]
jobs = 1
format = "json"
